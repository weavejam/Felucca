# The FM-1 plugin for tuttidaw (web/plugin/README.md): the generated headers (no JieLi toolchain), the browser emulator
# and the plugin built with Emscripten, their tests, and the plugin's static site for both deployment channels
# (web/plugin/site.mjs PLUGIN_CHANNEL): production (embeddable by https://tuttidaw.com and https://www.tuttidaw.com
# only) kept as an artifact on a push to main, preview (also http://localhost:<port>) on a pull request.
# Third-party actions are pinned to commits (the tag in the comment).
name: plugin-site

on:
  push:
    branches: [main]
    paths: ["firmware/**", "web/**", "tools/**", "assets/**", "LICENSE*", "LICENSES/**", "CREDITS.md", "LICENSING.md",
            ".gitignore", ".github/workflows/plugin-site.yml"]
  pull_request:
    paths: ["firmware/**", "web/**", "tools/**", "assets/**", "LICENSE*", "LICENSES/**", "CREDITS.md", "LICENSING.md",
            ".gitignore", ".github/workflows/plugin-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # (every build of main runs to its end)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: "24"

      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021   # v14
        with:
          version: "6.0.13"
          actions-cache-folder: emsdk-cache   # (in .gitignore: the site needs a clean tree)

      - name: Generated headers (fonts, icons, tables, samples)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libfribidi0   # Pillow's Raqm loads it (OpenType features)
          python3 -m pip install -q Pillow fonttools
          python3 tools/build.py --gen-only

      - name: Browser emulator (web/emu) and its test
        run: |
          sh web/emu/build.sh
          node web/emu/emu_test.mjs build/emu/felucca.wasm

      # both channels from one wasm; site.mjs fails on a tree with changes not in the commit (the source link)
      - name: FM-1 plugin (web/plugin), its sites and its test
        run: |
          git status --porcelain
          PLUGIN_CHANNEL="production preview" sh web/plugin/build.sh
          node web/plugin/plugin_test.mjs build/plugin-wasm/felucca.wasm build/emu/felucca.wasm

      - name: Keep the production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: fm1-plugin-site
          path: build/plugin-site
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep the preview site
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: fm1-plugin-site-preview
          path: build/plugin-site-preview
          include-hidden-files: true
          if-no-files-found: error

      # Deployment to Cloudflare Pages (by the lead for now), only from a push to main (the production site). To deploy
      # from here: a Pages project, the secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID, then
      # uncomment:
      # - name: Deploy to Cloudflare Pages
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy build/plugin-site --project-name=fm1-tutti-plugin --branch=main
